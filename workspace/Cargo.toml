[package]
name = "tquil"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
readme = "../README.md"
description = "Set up and manage a development machine: applications, Nerd Fonts, VPS profiles and config"
repository = "https://github.com/KiTechSoftware/tranquility"
homepage = "https://github.com/KiTechSoftware/tranquility"
authors = ["KiTech Software <oss@kitechsoftware.com>"]
keywords = ["cli", "devtools", "setup", "fonts", "ssh"]
categories = ["command-line-utilities"]


[[bin]]
name = "tquil"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
jsonschema = "0.61.0"
once_cell = "1.21.4"
quick-xml = { version = "0.42.0", features = ["serialize"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
strum = { version = "0.28.0", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
os_info = "3.15.0"
colored = "3.1.1"
bitflags = "2.13.2"
dialoguer = "0.12.0"
zip = "9.3.0"
heck = "0.5.0"
thiserror = "2.0.21"
scriba = { version = "0.5", features = ["prompt", "logger"] }

toml = "1.2.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }

assert_cmd = "2"
assert_matches = "1.5.0"
predicates = "3"
assert_fs = "1.1.4"

directories = "6.0.0"

libc = "0.2"
